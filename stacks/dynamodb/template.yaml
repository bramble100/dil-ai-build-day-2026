AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: DynamoDB stack (simple table)

Resources:
  QuizTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-quiz"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH

  ActivityTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-activity"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: dogName
          AttributeType: S
        - AttributeName: activityId
          AttributeType: S
      KeySchema:
        - AttributeName: dogName
          KeyType: HASH
        - AttributeName: activityId
          KeyType: RANGE

Outputs:
  QuizTableName:
    Value: !Ref QuizTable
    Export:
      Name: QuizTableName
  QuizTableArn:
    Value: !GetAtt QuizTable.Arn
    Export:
      Name: QuizTableArn
  ActivityTableName:
    Value: !Ref ActivityTable
  ActivityTableArn:
    Value: !GetAtt ActivityTable.Arn
