AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: API Gateway + Lambda

Parameters:
  BedrockInvokePolicyArn:
    Type: String
  QuizTableArn:
    Type: String
  QuizTableName:
    Type: String
  CorsAllowedOrigins:
    Type: String
    Default: 'http://localhost:5173'

Globals:
  Function:
    Timeout: 30
    Tracing: Active
    Environment:
      Variables:
        TABLE_NAME: !Ref QuizTableName
        CORS_ALLOWED_ORIGINS: !Ref CorsAllowedOrigins

  Api:
    TracingEnabled: true
    Cors:
      AllowOrigin: !Sub "'${CorsAllowedOrigins}'"
      AllowMethods: "'GET,OPTIONS,POST'"
      AllowHeaders: "'Content-Type,Authorization'"

Resources:
  QuizAppApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../api
      Handler: app.lambdaHandler
      Runtime: nodejs24.x
      Architectures: [x86_64]
      MemorySize: 1024
      Policies:
        - AWSLambdaBasicExecutionRole
        - !Ref BedrockInvokePolicyArn
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:Query
              Resource: !Ref QuizTableArn
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
                - aws-marketplace:Subscribe
                - aws-marketplace:ViewSubscriptions
              Resource: '*'
      Events:
        CreateQuiz:
          Type: Api
          Properties:
            Path: /create
            Method: get
        GetQuizById:
          Type: Api
          Properties:
            Path: /{id}
            Method: get
        SubmitAnswers:
          Type: Api
          Properties:
            Path: /{id}/submit
            Method: get
        EvaluateAnswers:
          Type: Api
          Properties:
            Path: /{id}/evaluate
            Method: get
        HealthCheck:
          Type: Api
          Properties:
            Path: /healthz
            Method: get
        HealthCheckBedrock:
          Type: Api
          Properties:
            Path: /healthz/bedrock
            Method: get
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints: [app.ts]

Outputs:
  ApiBaseUrl:
    Description: API base URL (Prod stage)
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod'
  FunctionArn:
    Value: !GetAtt QuizAppApiFunction.Arn
  FunctionRoleArn:
    Value: !GetAtt QuizAppApiFunctionRole.Arn
